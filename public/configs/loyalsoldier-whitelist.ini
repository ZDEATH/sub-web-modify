[custom]
clash_rule_base=base.yaml
enable_rule_generator=true
overwrite_original_rules=true

ruleset=applications,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt,DIRECT
ruleset=private,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt,DIRECT
ruleset=reject,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt,REJECT
ruleset=icloud,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt,DIRECT
ruleset=apple,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt,DIRECT
ruleset=google,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt,PROXY
ruleset=proxy,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt,PROXY
ruleset=direct,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt,DIRECT
ruleset=lancidr,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt,DIRECT
ruleset=cncidr,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt,DIRECT
ruleset=telegramcidr,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt,PROXY
ruleset=tld-not-cn,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt,PROXY
ruleset=gfw,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt,PROXY
ruleset=lan,[]GEOIP,LAN,DIRECT
ruleset=cn,[]GEOIP,CN,DIRECT
ruleset=match,[]MATCH,PROXY

custom_proxy_group=PROXY`select`[]AUTO`[]DIRECT`.*
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,,50
