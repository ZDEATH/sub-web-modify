name: sub-web-modify-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sub-web-modify-dev
    ports:
      - "8090:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
    volumes:
      - .:/app
      - sub-web-modify-node-modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  sub-web-modify-node-modules:
